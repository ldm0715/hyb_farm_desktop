name: hyb_farm_desktop
description: "黑与白农场助手的 Flutter 桌面客户端"
publish_to: 'none'
version: 0.1.6

environment:
  sdk: ^3.10.7

dependencies:
  crypto: ^3.0.0
  dio: ^5.11.0
  file_selector: ^1.0.3
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.1.5
  flutter_local_notifications: ^22.3.0
  flutter_markdown: ^0.7.7
  flutter_secure_storage: ^11.0.0
  path_provider: ^2.1.5
  provider: ^6.1.5+1
  screen_retriever: ^0.2.2
  shared_preferences: ^2.5.5
  system_tray: ^2.0.3
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.ico
    - assets/icon/logo_error.ico
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansSC-SemiBold.ttf
          weight: 600
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
